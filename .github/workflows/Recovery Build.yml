name: PBRP Recovery Build (Android 8.1)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'PBRP Manifest URL'
        required: true
        default: 'https://github.com/PitchBlackRecoveryProject/manifest_pb.git'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'android-8.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/yolinuxman-design/samsung_a2corelte-twrp'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'testing'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/samsung/a2corelte'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'a2corelte'
      MAKEFILE_NAME:
        description: 'Makefile Name (must start with pb_)'
        required: true
        default: 'pb_a2corelte'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'pbrp'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        set -e
        mkdir -p ${{ github.workspace }}/workspace
        echo "workspace-folder=${{ github.workspace }}/workspace" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment (Android 8.1 Legacy)
      run: |
        set -e
        sudo dpkg --add-architecture i386
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip python2.7 \
            python3 python3-pip bc ccache rsync schedtool imagemagick \
            lzop pngcrush libssl-dev aria2

        # Symlink python for older Android builds
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python2 || true
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
      working-directory: ${{ github.workspace }}

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Setup SSH Keys
      if: |
        startsWith(github.event.inputs.MANIFEST_URL, 'git@') ||
        startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@') ||
        startsWith(github.event.inputs.COMMON_TREE_URL, 'git@')
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync PBRP sources
      run: |
        set -e
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1 --groups=all,-notdefault,-device,-darwin,-x86,-mips
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        echo "=== Verifying sync ==="
        ls -la ${{ steps.pwd.outputs.workspace-folder }}/
      working-directory: ${{ github.workspace }}

    - name: Clone device tree
      run: |
        set -e
        mkdir -p $(dirname ${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }})
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ github.workspace }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building PBRP
      run: |
        set -e
        cd ${{ steps.pwd.outputs.workspace-folder }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)
      working-directory: ${{ github.workspace }}

    - name: Check the output directory
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/ || true
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ || true

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: PBRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: pbrp-${{ github.run_id }}
        body: |
          Recovery: PitchBlack Recovery Project (PBRP)
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
